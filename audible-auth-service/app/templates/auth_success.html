<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="3;url=/">
    <title>Autenticação Concluída - OpenAudible Manager</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius:16px; padding:36px; max-width:500px; text-align:center; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5); }
        h1 { color: #10b981; margin-bottom: 12px; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 16px; }
        .btn { display:block; background:#f59e0b; color:#000; font-weight:700; padding:14px 24px; border-radius:10px; text-decoration:none; margin-top:24px; font-size: 1.05rem; box-shadow:0 4px 12px rgba(245,158,11,0.3); }
        .btn:hover { background:#d97706; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ Autenticação Concluída!</h1>
        <p>Bem-vindo(a), <strong>{{ user_name }}</strong> ({{ user_email }})!</p>
        <p>Seus tokens para a <strong>Audible Brasil</strong> foram salvos e criptografados no banco de dados.</p>
        <p style="font-size:0.85rem; color:#f59e0b;">Redirecionando para a sua Biblioteca em 3 segundos...</p>
        <a href="/" class="btn">🚀 Abrir Minha Biblioteca Agora</a>
    </div>
</body>
</html>
