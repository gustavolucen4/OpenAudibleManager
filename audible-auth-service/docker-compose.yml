version: '3.8'

services:
  openaudible-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: openaudible-manager:latest
    container_name: openaudible-manager
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - APP_NAME=OpenAudible Manager
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=sqlite:////app/data/auth.db
      - SECRET_KEY=prod_secret_key_please_change
      - DEFAULT_MARKETPLACE=br
    volumes:
      - openaudible_data:/app/data
      - openaudible_downloads:/app/downloads

volumes:
  openaudible_data:
    driver: local
  openaudible_downloads:
    driver: local
